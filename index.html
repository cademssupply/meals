<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#151515">

  <title>Meal & Macro Tracker</title>

  <style>
    :root {
      --bg: #151515;
      --panel: #242424;
      --panel2: #303030;
      --orange: #f58220;
      --orange-dark: #d86e10;
      --text: #ffffff;
      --muted: #b8b8b8;
      --border: #4a4a4a;
      --success: #69c96b;
      --danger: #ff7772;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      padding: 18px 18px calc(30px + env(safe-area-inset-bottom));
    }

    h1 {
      margin: 4px 0 5px;
      font-size: 28px;
    }

    h2 {
      margin: 0 0 14px;
      font-size: 20px;
    }

    .date {
      color: var(--muted);
      margin-bottom: 20px;
    }

    .card {
      background: var(--panel);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    }

    .macro-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .macro-box {
      background: var(--panel2);
      border-radius: 10px;
      padding: 12px;
      text-align: center;
    }

    .macro-label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 5px;
    }

    .macro-value {
      color: var(--orange);
      font-size: 22px;
      font-weight: bold;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 14px;
      margin-top: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: default;
    }

    .primary {
      background: var(--orange);
      color: #111;
    }

    .primary:active {
      background: var(--orange-dark);
    }

    .secondary {
      background: var(--panel2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 5px;
      font-size: 14px;
      color: var(--muted);
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid #555;
      border-radius: 8px;
      padding: 12px;
      background: #1c1c1c;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: var(--orange);
    }

    textarea {
      min-height: 85px;
      resize: vertical;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .hidden {
      display: none;
    }

    .status {
      display: none;
      margin-top: 12px;
      padding: 11px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.4;
    }

    .status.success {
      display: block;
      color: #a9e8aa;
      background: rgba(76, 175, 80, 0.18);
    }

    .status.error {
      display: block;
      color: #ffaaa6;
      background: rgba(217, 83, 79, 0.18);
    }

    .status.info {
      display: block;
      color: #ffd0a3;
      background: rgba(245, 130, 32, 0.15);
    }

    .meal-item {
      background: var(--panel2);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .meal-name {
      font-size: 16px;
      font-weight: bold;
    }

    .meal-time {
      float: right;
      color: var(--muted);
      font-size: 12px;
      font-weight: normal;
    }

    .meal-description {
      color: var(--muted);
      margin-top: 5px;
      font-size: 14px;
      line-height: 1.4;
    }

    .meal-macros {
      margin-top: 9px;
      font-size: 14px;
    }

    @media (min-width: 600px) {
      .macro-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>

<body>

<div class="app">

  <h1>Meal & Macro Tracker</h1>

  <div class="date" id="todayDate"></div>

  <div class="card">
    <h2>Today's Totals</h2>

    <div class="macro-grid">

      <div class="macro-box">
        <span class="macro-label">Calories</span>
        <span class="macro-value" id="totalCalories">0</span>
      </div>

      <div class="macro-box">
        <span class="macro-label">Protein</span>
        <span class="macro-value" id="totalProtein">0g</span>
      </div>

      <div class="macro-box">
        <span class="macro-label">Carbs</span>
        <span class="macro-value" id="totalCarbs">0g</span>
      </div>

      <div class="macro-box">
        <span class="macro-label">Fat</span>
        <span class="macro-value" id="totalFat">0g</span>
      </div>

      <div class="macro-box">
        <span class="macro-label">Fiber</span>
        <span class="macro-value" id="totalFiber">0g</span>
      </div>

      <div class="macro-box">
        <span class="macro-label">Sodium</span>
        <span class="macro-value" id="totalSodium">0mg</span>
      </div>

    </div>
  </div>

  <div class="card">

    <button
      class="primary"
      onclick="showMealForm()">
      + Log Meal
    </button>

    <button
      class="secondary"
      onclick="showCheckInForm()">
      Daily Check-In
    </button>

  </div>

  <div
    class="card hidden"
    id="mealFormCard">

    <h2>Log Meal</h2>

    <label for="mealType">Meal</label>

    <select id="mealType">
      <option value="Breakfast">Breakfast</option>
      <option value="Lunch">Lunch</option>
      <option value="Dinner">Dinner</option>
      <option value="Snack">Snack</option>
      <option value="Other">Other</option>
    </select>

    <label for="mealDescription">Description</label>

    <textarea
      id="mealDescription"
      placeholder="Example: 6 oz chicken breast, 1/2 cup rice and 1/2 cup corn">
    </textarea>

    <div class="row">

      <div>
        <label for="protein">Protein (g)</label>

        <input
          type="number"
          inputmode="decimal"
          step="0.1"
          id="protein">
      </div>

      <div>
        <label for="carbs">Carbs (g)</label>

        <input
          type="number"
          inputmode="decimal"
          step="0.1"
          id="carbs">
      </div>

    </div>

    <div class="row">

      <div>
        <label for="fat">Fat (g)</label>

        <input
          type="number"
          inputmode="decimal"
          step="0.1"
          id="fat">
      </div>

      <div>
        <label for="fiber">Fiber (g)</label>

        <input
          type="number"
          inputmode="decimal"
          step="0.1"
          id="fiber">
      </div>

    </div>

    <div class="row">

      <div>
        <label for="sodium">Sodium (mg)</label>

        <input
          type="number"
          inputmode="numeric"
          step="1"
          id="sodium">
      </div>

      <div>
        <label for="calories">Calories</label>

        <input
          type="number"
          inputmode="numeric"
          step="1"
          id="calories">
      </div>

    </div>

    <button
      class="primary"
      id="saveMealButton"
      onclick="logMeal()">
      Save Meal
    </button>

    <button
      class="secondary"
      onclick="hideMealForm()">
      Cancel
    </button>

    <div
      class="status"
      id="mealStatus">
    </div>

  </div>

  <div
    class="card hidden"
    id="checkInCard">

    <h2>Daily Check-In</h2>

    <div class="row">

      <div>
        <label for="weight">Weight</label>

        <input
          type="number"
          inputmode="decimal"
          step="0.1"
          id="weight">
      </div>

      <div>
        <label for="waist">Waist</label>

        <input
          type="number"
          inputmode="decimal"
          step="0.1"
          id="waist">
      </div>

    </div>

    <label for="resistanceMinutes">
      Resistance Training Minutes
    </label>

    <input
      type="number"
      inputmode="numeric"
      step="1"
      id="resistanceMinutes">

    <label for="muscleGroups">
      Muscle Groups
    </label>

    <input
      type="text"
      id="muscleGroups"
      placeholder="Example: Chest, shoulders, triceps">

    <label for="cardioMinutes">
      Cardio Minutes
    </label>

    <input
      type="number"
      inputmode="numeric"
      step="1"
      id="cardioMinutes">

    <label for="cardioType">
      Cardio Type
    </label>

    <input
      type="text"
      id="cardioType"
      placeholder="Example: Incline treadmill">

    <label for="steps">
      Steps
    </label>

    <input
      type="number"
      inputmode="numeric"
      step="1"
      id="steps">

    <label for="sleep">
      Sleep Hours
    </label>

    <input
      type="number"
      inputmode="decimal"
      step="0.1"
      id="sleep">

    <button
      class="primary"
      id="saveCheckInButton"
      onclick="saveDailyCheckIn()">
      Save Check-In
    </button>

    <button
      class="secondary"
      onclick="hideCheckInForm()">
      Cancel
    </button>

    <div
      class="status"
      id="checkInStatus">
    </div>

  </div>

  <div class="card">

    <h2>Today's Meals</h2>

    <div id="mealList">
      Loading...
    </div>

    <button
      class="secondary"
      onclick="loadToday()">
      Refresh
    </button>

  </div>

</div>

<script>

  const SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbzmtoF1u1ur7K2lM5QtW9ETV72DGEXOv6QhFNAjKnfOPVRF9JyoPPHaHLza_At9gOtR/exec";


  function getTodayString() {

    const now = new Date();

    const year =
      now.getFullYear();

    const month =
      String(
        now.getMonth() + 1
      ).padStart(2, "0");

    const day =
      String(
        now.getDate()
      ).padStart(2, "0");

    return `${year}-${month}-${day}`;
  }


  function showDate() {

    const now =
      new Date();

    document
      .getElementById("todayDate")
      .textContent =
        now.toLocaleDateString(
          "en-US",
          {
            weekday: "long",
            month: "long",
            day: "numeric",
            year: "numeric"
          }
        );
  }


  function showMealForm() {

    document
      .getElementById("mealFormCard")
      .classList
      .remove("hidden");

    document
      .getElementById("checkInCard")
      .classList
      .add("hidden");
  }


  function hideMealForm() {

    document
      .getElementById("mealFormCard")
      .classList
      .add("hidden");
  }


  function showCheckInForm() {

    document
      .getElementById("checkInCard")
      .classList
      .remove("hidden");

    document
      .getElementById("mealFormCard")
      .classList
      .add("hidden");
  }


  function hideCheckInForm() {

    document
      .getElementById("checkInCard")
      .classList
      .add("hidden");
  }


  async function postData(data) {

    const response =
      await fetch(
        SCRIPT_URL,
        {
          method: "POST",
          body: JSON.stringify(data)
        }
      );

    if (!response.ok) {

      throw new Error(
        "Could not connect to the meal tracker."
      );
    }

    return await response.json();
  }


  async function logMeal() {

    const status =
      document
        .getElementById(
          "mealStatus"
        );

    const button =
      document
        .getElementById(
          "saveMealButton"
        );

    status.className =
      "status info";

    status.textContent =
      "Saving meal...";

    button.disabled =
      true;

    try {

      const data = {

        action:
          "addMeal",

        date:
          getTodayString(),

        meal:
          document
            .getElementById(
              "mealType"
            )
            .value,

        description:
          document
            .getElementById(
              "mealDescription"
            )
            .value,

        protein:
          document
            .getElementById(
              "protein"
            )
            .value,

        carbs:
          document
            .getElementById(
              "carbs"
            )
            .value,

        fat:
          document
            .getElementById(
              "fat"
            )
            .value,

        fiber:
          document
            .getElementById(
              "fiber"
            )
            .value,

        sodium:
          document
            .getElementById(
              "sodium"
            )
            .value,

        calories:
          document
            .getElementById(
              "calories"
            )
            .value
      };

      const result =
        await postData(data);

      if (!result.success) {

        throw new Error(
          result.message ||
          "Meal could not be saved."
        );
      }

      status.className =
        "status success";

      status.textContent =
        "Meal saved successfully.";

      clearMealForm();

      await loadToday();

      setTimeout(
        function() {
          hideMealForm();
        },
        700
      );

    } catch (error) {

      status.className =
        "status error";

      status.textContent =
        error.message;

    } finally {

      button.disabled =
        false;
    }
  }


  function clearMealForm() {

    document
      .getElementById(
        "mealDescription"
      )
      .value = "";

    document
      .getElementById(
        "protein"
      )
      .value = "";

    document
      .getElementById(
        "carbs"
      )
      .value = "";

    document
      .getElementById(
        "fat"
      )
      .value = "";

    document
      .getElementById(
        "fiber"
      )
      .value = "";

    document
      .getElementById(
        "sodium"
      )
      .value = "";

    document
      .getElementById(
        "calories"
      )
      .value = "";
  }


  async function saveDailyCheckIn() {

    const status =
      document
        .getElementById(
          "checkInStatus"
        );

    const button =
      document
        .getElementById(
          "saveCheckInButton"
        );

    status.className =
      "status info";

    status.textContent =
      "Saving check-in...";

    button.disabled =
      true;

    try {

      const data = {

        action:
          "saveDailyCheckIn",

        date:
          getTodayString(),

        weight:
          document
            .getElementById(
              "weight"
            )
            .value,

        waist:
          document
            .getElementById(
              "waist"
            )
            .value,

        resistanceMinutes:
          document
            .getElementById(
              "resistanceMinutes"
            )
            .value,

        muscleGroups:
          document
            .getElementById(
              "muscleGroups"
            )
            .value,

        cardioMinutes:
          document
            .getElementById(
              "cardioMinutes"
            )
            .value,

        cardioType:
          document
            .getElementById(
              "cardioType"
            )
            .value,

        steps:
          document
            .getElementById(
              "steps"
            )
            .value,

        sleep:
          document
            .getElementById(
              "sleep"
            )
            .value
      };

      const result =
        await postData(data);

      if (!result.success) {

        throw new Error(
          result.message ||
          "Check-in could not be saved."
        );
      }

      status.className =
        "status success";

      status.textContent =
        "Daily check-in saved.";

      await loadToday();

    } catch (error) {

      status.className =
        "status error";

      status.textContent =
        error.message;

    } finally {

      button.disabled =
        false;
    }
  }


  async function loadToday() {

    try {

      const result =
        await postData({

          action:
            "getToday",

          date:
            getTodayString()
        });

      if (!result.success) {

        throw new Error(
          result.message ||
          "Could not load today's information."
        );
      }

      updateTotals(
        result.daily
      );

      updateCheckInFields(
        result.daily
      );

      updateMeals(
        result.meals
      );

    } catch (error) {

      document
        .getElementById(
          "mealList"
        )
        .innerHTML =
          `<div style="color:#ffaaa6;">
            ${escapeHTML(error.message)}
          </div>`;
    }
  }


  function updateTotals(daily) {

    const calories =
      daily?.calories || 0;

    const protein =
      daily?.protein || 0;

    const carbs =
      daily?.carbs || 0;

    const fat =
      daily?.fat || 0;

    const fiber =
      daily?.fiber || 0;

    const sodium =
      daily?.sodium || 0;

    document
      .getElementById(
        "totalCalories"
      )
      .textContent =
        calories;

    document
      .getElementById(
        "totalProtein"
      )
      .textContent =
        protein + "g";

    document
      .getElementById(
        "totalCarbs"
      )
      .textContent =
        carbs + "g";

    document
      .getElementById(
        "totalFat"
      )
      .textContent =
        fat + "g";

    document
      .getElementById(
        "totalFiber"
      )
      .textContent =
        fiber + "g";

    document
      .getElementById(
        "totalSodium"
      )
      .textContent =
        sodium + "mg";
  }


  function updateCheckInFields(daily) {

    if (!daily) {
      return;
    }

    document
      .getElementById(
        "weight"
      )
      .value =
        daily.weight ?? "";

    document
      .getElementById(
        "waist"
      )
      .value =
        daily.waist ?? "";

    document
      .getElementById(
        "resistanceMinutes"
      )
      .value =
        daily.resistanceMinutes ?? "";

    document
      .getElementById(
        "muscleGroups"
      )
      .value =
        daily.muscleGroups ?? "";

    document
      .getElementById(
        "cardioMinutes"
      )
      .value =
        daily.cardioMinutes ?? "";

    document
      .getElementById(
        "cardioType"
      )
      .value =
        daily.cardioType ?? "";

    document
      .getElementById(
        "steps"
      )
      .value =
        daily.steps ?? "";

    document
      .getElementById(
        "sleep"
      )
      .value =
        daily.sleep ?? "";
  }


  function updateMeals(meals) {

    const container =
      document
        .getElementById(
          "mealList"
        );

    if (
      !meals ||
      meals.length === 0
    ) {

      container.innerHTML =
        `<div style="color:#b8b8b8;">
          No meals logged today.
        </div>`;

      return;
    }

    container.innerHTML =
      meals
        .map(
          function(meal) {

            return `
              <div class="meal-item">

                <div class="meal-name">

                  ${escapeHTML(
                    meal.meal ||
                    "Meal"
                  )}

                  <span class="meal-time">

                    ${escapeHTML(
                      meal.time || ""
                    )}

                  </span>

                </div>

                <div class="meal-description">

                  ${escapeHTML(
                    meal.description ||
                    ""
                  )}

                </div>

                <div class="meal-macros">

                  ${meal.calories || 0}
                  cal

                  &nbsp; | &nbsp;

                  ${meal.protein || 0}P

                  &nbsp; | &nbsp;

                  ${meal.carbs || 0}C

                  &nbsp; | &nbsp;

                  ${meal.fat || 0}F

                </div>

              </div>
            `;
          }
        )
        .join("");
  }


  document.addEventListener(
    "keydown",
    function(event) {

      if (
        event.key !== "Enter"
      ) {
        return;
      }

      const active =
        document.activeElement;

      if (
        active.tagName ===
        "TEXTAREA"
      ) {
        return;
      }

      const visibleFields =
        Array
          .from(
            document.querySelectorAll(
              `
              input:not([disabled]),
              select:not([disabled])
              `
            )
          )
          .filter(
            function(element) {
              return (
                element.offsetParent !==
                null
              );
            }
          );

      const index =
        visibleFields.indexOf(
          active
        );

      if (
        index === -1
      ) {
        return;
      }

      const next =
        visibleFields[
          index + 1
        ];

      if (next) {

        event.preventDefault();

        next.focus();
      }
    }
  );


  function escapeHTML(value) {

    return String(
      value ?? ""
    )
      .replaceAll(
        "&",
        "&amp;"
      )
      .replaceAll(
        "<",
        "&lt;"
      )
      .replaceAll(
        ">",
        "&gt;"
      )
      .replaceAll(
        '"',
        "&quot;"
      )
      .replaceAll(
        "'",
        "&#039;"
      );
  }


  showDate();

  loadToday();

</script>

</body>
</html>
